name: Delete leftover branch (one time)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/git/refs/heads/peek"
