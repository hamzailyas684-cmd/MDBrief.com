name: Delete leftover branch (one time)
on: workflow_dispatch
permissions: { contents: write }
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -X DELETE -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/peek"
