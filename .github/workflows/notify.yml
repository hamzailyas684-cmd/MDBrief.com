name: 5 pm notifications

on:
  schedule:
    - cron: "17 * * * *"   # every hour; each device gets its update at about 5 pm in its own time zone
  workflow_dispatch:
    inputs:
      send_now:
        description: "Send everyone today's update right now (for testing)"
        type: boolean
        default: false

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # MDBrief's code lives in the private repository hamzailyas684-cmd/mdbrief-core (fetched with CORE_TOKEN).
      # If that ever fails, the encrypted backup on this repo's "backup" branch is used instead, so nothing stops.
      - name: Get MDBrief's code (private, with encrypted backup)
        id: core
        uses: ./.github/actions/get-core
        with:
          core-token: ${{ secrets.CORE_TOKEN }}
          backup-key: ${{ secrets.VAPID_PRIVATE_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: core
        run: npm install --no-save --no-audit --no-fund --prefix notify web-push@3.6.7 jsdom@26.1.0
      - name: Send notifications
        working-directory: core
        run: node notify/send.mjs
        env:
          SEND_NOW: ${{ inputs.send_now }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
