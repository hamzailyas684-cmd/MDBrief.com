name: Opt-out list

# Run by hand before sending outreach emails. Prints the opt-out list encrypted; nothing readable appears in the logs.
on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # MDBrief's code lives in the private repository hamzailyas684-cmd/mdbrief-core (fetched with CORE_TOKEN).
      # If that ever fails, the encrypted backup on this repo's "backup" branch is used instead, so nothing stops.
      - name: Get MDBrief's code (private, with encrypted backup)
        id: core
        uses: ./.github/actions/get-core
        with:
          core-token: ${{ secrets.CORE_TOKEN }}
          backup-key: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Read and encrypt the opt-out list
        working-directory: core
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$KEY" | tr -d '[:space:]')
          URL=$(grep -o 'const NOTIFY_DB_URL = "[^"]*"' index.html | cut -d'"' -f2)
          AUTH=()
          case "$KEY" in sb_*) ;; *) AUTH=(-H "Authorization: Bearer $KEY");; esac
          curl -fsS "$URL/rest/v1/optouts?select=email,created_at&order=created_at" -H "apikey: $KEY" "${AUTH[@]}" > list.json
          N=$(python3 -c "import json;print(len(json.load(open('list.json'))))")
          openssl cms -encrypt -binary -aes256 -in list.json -outform DER notify/optout-cert.pem | base64 -w0 > enc.txt
          echo "::notice title=OPTOUTS ${N}::$(cat enc.txt)"
