name: Collect papers and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      fast:
        description: "Code change only: reuse today's paper lists instead of collecting again"
        type: boolean
        default: false

permissions:
  contents: write   # only used to update the encrypted backup branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      collect: ${{ steps.collect.outcome }}
      from: ${{ steps.core.outputs.from }}
    steps:
      - uses: actions/checkout@v4
      # MDBrief's code lives in the private repository hamzailyas684-cmd/mdbrief-core (fetched with CORE_TOKEN).
      # If that ever fails, the encrypted backup on this repo's "backup" branch is used instead, so nothing stops.
      - name: Get MDBrief's code (private, with encrypted backup)
        id: core
        uses: ./.github/actions/get-core
        with:
          core-token: ${{ secrets.CORE_TOKEN }}
          backup-key: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Keep the encrypted backup up to date
        if: steps.core.outputs.from == 'private'
        continue-on-error: true
        uses: ./.github/actions/save-backup
        with:
          backup-key: ${{ secrets.VAPID_PRIVATE_KEY }}
          hash: ${{ steps.core.outputs.hash }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the website
        working-directory: core
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest logo.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png email-icon.png og-image.png sitemap.xml unsubscribe.html CNAME robots.txt _site/
          touch _site/.nojekyll
      - name: Install
        working-directory: core
        run: npm install --no-save --no-audit --no-fund --prefix build jsdom@26.1.0
      - name: Reuse current paper lists (code changes go live fast)
        id: reuse
        if: github.event_name == 'push' || inputs.fast
        continue-on-error: true
        working-directory: core
        run: node build/reuse.mjs _site
      - name: Collect every specialty's papers
        id: collect
        if: (github.event_name != 'push' && !inputs.fast) || steps.reuse.outcome != 'success'
        continue-on-error: true
        working-directory: core
        run: node build/snapshot.mjs _site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - uses: actions/upload-pages-artifact@v3
        with:
          path: core/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # If collecting papers or publishing failed, this job fails, and GitHub emails the account that started the run.
  check:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report problems
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then echo "::error::The build failed (for example, the private code could not be fetched)."; exit 1; fi
          if [ "${{ needs.build.outputs.collect }}" = "failure" ]; then echo "::error::Collecting papers failed. See the 'Collect every specialty's papers' step."; exit 1; fi
          if [ "${{ needs.deploy.result }}" != "success" ]; then echo "::error::Publishing the site failed."; exit 1; fi
          # Running on the backup copy keeps everything working; send one reminder a day (via a failed check) to renew the key.
          if [ "${{ needs.build.outputs.from }}" = "backup" ] && [ "$(date -u +%H)" = "12" ] && [ "$(date -u +%M)" -lt 30 ]; then echo "::error::MDBrief is running from its encrypted backup because CORE_TOKEN no longer works. Everything still runs, but please make a new key and update the CORE_TOKEN secret."; exit 1; fi
          echo "All good"
