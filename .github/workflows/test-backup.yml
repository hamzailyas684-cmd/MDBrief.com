name: Test backup (temporary)
on: { workflow_dispatch: }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: core
        uses: ./.github/actions/get-core
        with:
          core-token: "deliberately-broken-key"
          backup-key: ${{ secrets.VAPID_PRIVATE_KEY }}
      - run: |
          echo "from=${{ steps.core.outputs.from }}"
          test "${{ steps.core.outputs.from }}" = "backup"
          test -f core/index.html && test -f core/build/snapshot.mjs && test -f core/notify/send.mjs
          echo "::notice::BACKUP OK from=${{ steps.core.outputs.from }} hash=${{ steps.core.outputs.hash }}"
      - name: Run the alert job's code from the backup (dry run)
        working-directory: core
        run: npm install --no-save --no-audit --no-fund --prefix notify web-push@3.6.7 jsdom@26.1.0 >/dev/null && node -e "import('./notify/send.mjs').then(()=>console.log('send.mjs loads from backup'))"
